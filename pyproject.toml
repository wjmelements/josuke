[project]
name = "josuke"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["click", "click-spinner", "eth-abi", "eth-utils", "eth-hash[pycryptodome]", "jsonschema", "requests"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]

[project.scripts]
josuke = "josuke.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
josuke = ["josuke.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
