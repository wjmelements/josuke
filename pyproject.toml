[project]
name = "josuke"
version = "0.0.1"
dependencies = ["click", "eth-utils", "eth-hash[pycryptodome]"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mytool = "josuke.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
