name: schema

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install .
      - name: Validate josuke.example.json against josuke.schema.json
        run: |
          python - <<'EOF'
          import json

          from josuke.ledger import validate_ledger

          with open("josuke.example.json") as f:
              errors = validate_ledger(json.load(f))
          if errors:
              raise SystemExit("\n".join(errors))
          print("josuke.example.json is valid")
          EOF
